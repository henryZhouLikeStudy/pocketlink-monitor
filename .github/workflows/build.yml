name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore PocketLink.sln

    - name: Build solution
      run: dotnet build PocketLink.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test PocketLink.sln --configuration Release --no-build --verbosity normal
